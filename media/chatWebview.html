<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
	{{styleTags}}
	<title>Crust Chat</title>
</head>
<body>
	<div class="app">
		<header class="title-bar">
			<div id="session-title" class="session-title">New Chat</div>
			<div class="title-actions">
				<button id="history" class="title-action-button" type="button" aria-label="Show chat history" title="History">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M3.25 4.75A5.5 5.5 0 1 1 2.5 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
						<path d="M3.25 2.25v2.5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M8 5.25V8l2 1.25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
				<button id="new-chat" class="title-action-button" type="button" aria-label="New chat" title="New chat">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M8 3.25v9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
						<path d="M3.25 8h9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
					</svg>
				</button>
			</div>
		</header>
		<main id="messages" class="messages" aria-live="polite">
			<div id="empty-state" class="empty-state{{initialLoadingClass}}">
				<div class="empty-state-spinner" aria-hidden="true"></div>
				<img class="empty-state-icon" src="{{iconUri}}" alt="" aria-hidden="true">
				<p id="empty-state-text" class="empty-state-text">{{emptyStateText}}</p>
			</div>
			<div id="messages-content" class="messages-content"></div>
		</main>
		<nav class="conversation-nav" aria-label="Conversation navigation">
			<span class="conversation-nav-item" data-tooltip="Jump to top">
				<button id="jump-top" class="conversation-nav-button" type="button" aria-label="Jump to top">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M4 7L8 3L12 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M4 12L8 8L12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</span>
			<span class="conversation-nav-item" data-tooltip="Jump to previous prompt">
				<button id="jump-previous-user" class="conversation-nav-button" type="button" aria-label="Jump to previous prompt">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M4 10L8 6L12 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</span>
			<span class="conversation-nav-item" data-tooltip="Jump to next prompt">
				<button id="jump-next-user" class="conversation-nav-button" type="button" aria-label="Jump to next prompt">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</span>
			<span class="conversation-nav-item" data-tooltip="Follow chat">
				<button id="follow-chat" class="conversation-nav-button active" type="button" aria-label="Follow chat" aria-pressed="true">
					<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
						<path d="M3.5 13H12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
					</svg>
				</button>
			</span>
		</nav>
		<form id="form" class="controls">
			<div id="reset-restore-banner" class="reset-restore-banner hidden" role="status">
				<span id="reset-restore-message">Changes reverted.</span>
				<div class="reset-restore-actions">
					<button id="reset-restore-button" class="reset-restore-button" type="button">Undo</button>
					<button id="reset-restore-dismiss" class="reset-restore-dismiss" type="button" aria-label="Dismiss restore code banner" title="Dismiss">
						<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M4 4L12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
							<path d="M12 4L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
						</svg>
					</button>
				</div>
			</div>
			<div class="input-row">
				<div class="prompt-column">
					<button id="ide-context" class="ide-context-button hidden" type="button" aria-pressed="true" title="Use IDE context">
						<svg class="eye-open" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M1.75 8S4 4.25 8 4.25S14.25 8 14.25 8S12 11.75 8 11.75S1.75 8 1.75 8Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
							<circle cx="8" cy="8" r="1.75" stroke="currentColor" stroke-width="1.3"/>
						</svg>
						<svg class="eye-off" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M1.75 8S4 4.25 8 4.25S14.25 8 14.25 8S12 11.75 8 11.75S1.75 8 1.75 8Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
							<circle cx="8" cy="8" r="1.75" stroke="currentColor" stroke-width="1.3"/>
							<path d="M3 13L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
						</svg>
						<span id="ide-context-label"></span>
					</button>
					<div id="slash-autocomplete" class="slash-autocomplete hidden" role="listbox" aria-label="Slash commands"></div>
					<textarea id="prompt" rows="1" placeholder="Ask Pi..." aria-autocomplete="list" aria-controls="slash-autocomplete"></textarea>
				</div>
				<button id="submit" type="submit" aria-label="Submit prompt" title="Submit prompt">
					<svg class="submit-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M8 13V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
						<path d="M3.75 7.25L8 3L12.25 7.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
					<svg class="stop-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1" fill="currentColor"/>
					</svg>
				</button>
			</div>
			<div class="metadata-row">
				<select id="model" aria-label="Model"><option value="">Loading models…</option></select>
				<div id="status" class="status"></div>
			</div>
		</form>
	</div>
	<div id="modal-backdrop" class="modal-backdrop hidden" role="presentation">
		<div class="webview-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-detail">
			<div id="modal-icon" class="modal-icon" aria-hidden="true"></div>
			<div class="modal-content">
				<h2 id="modal-title" class="modal-title"></h2>
				<p id="modal-detail" class="modal-detail"></p>
				<select id="modal-select" class="modal-select" hidden></select>
				<div class="modal-actions">
					<button id="modal-cancel" class="modal-button secondary" type="button">Cancel</button>
					<button id="modal-confirm" class="modal-button primary" type="button">OK</button>
				</div>
			</div>
		</div>
	</div>

	{{scriptTags}}
</body>
</html>
